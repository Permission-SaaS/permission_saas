# Configuração comum a todos os ambientes. O que muda entre eles (banco, log de
# SQL) fica em application-dev.yml e application-prod.yml.
spring:
  application:
    name: audit-service

  # Sem SPRING_PROFILES_ACTIVE, sobe como desenvolvimento. O Docker Compose ativa o prod.
  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Uma falha ao gravar (banco fora, por exemplo) é tentada de novo 3 vezes, com
  # intervalo crescente; depois a mensagem vai para a fila de mensagens mortas.
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

# Fila de onde o serviço consome os eventos de auditoria.
audit:
  messaging:
    queue: audit.events

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
