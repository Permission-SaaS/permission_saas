# Desenvolvimento: o serviço roda na máquina (IDE ou ./mvnw) e acha o próprio banco
# em localhost:5433 (o audit-postgres do Compose). Toda variável tem valor padrão,
# então nenhuma é obrigatória.
spring:
  # Em desenvolvimento o serviço não depende do Config Server.
  cloud:
    config:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/audit_db}
    username: ${DB_USERNAME:audit}
    password: ${DB_PASSWORD:audit123}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:saas}
    password: ${RABBITMQ_PASSWORD:saas123}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
