spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  # Sem Flyway nos testes, o Batch cria as próprias tabelas no H2.
  batch:
    jdbc:
      initialize-schema: embedded

app:
  swagger:
    username: test
    password: test

audit:
  service:
    url: http://localhost:8081
