# Configuração comum a todos os ambientes. O que muda entre eles (banco,
# endereço do audit-service, segredos, log de SQL) fica em application-dev.yml
# e application-prod.yml.
spring:
  application:
    name: permission-service

  # Sem SPRING_PROFILES_ACTIVE, sobe como desenvolvimento. O Docker Compose ativa o prod.
  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing,*:future"
    validate-on-migrate: false

  # O Feign só serve a consulta da trilha (GET /audit-events): com o default dele
  # (60s de leitura), um audit-service travado prenderia a requisição por um minuto
  # antes do 503.
  cloud:
    openfeign:
      client:
        config:
          audit-service:
            connect-timeout: 1000
            read-timeout: 2000

  # A publicação da auditoria roda na thread da validação de permissão: com o broker
  # fora do ar, desiste em 1s em vez de prender a validação.
  rabbitmq:
    connection-timeout: 1s

app:
  jwt:
    expiration-ms: 3600000

# Fila em que a aplicação publica cada validação de permissão para o audit-service.
audit:
  messaging:
    queue: audit.events

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  show-actuator: true
