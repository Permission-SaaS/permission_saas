# Produção: a configuração de ambiente (endereço do banco, do audit-service e do
# RabbitMQ, log de SQL) vem do Config Server, em config-repo/. Os
# segredos vêm de variáveis de ambiente, sem valor padrão. Se o Config Server não
# responder ou faltar uma variável, a aplicação não sobe — melhor do que subir
# apontando para o banco ou o serviço errado.
spring:
  config:
    import: configserver:${CONFIG_SERVER_URL}

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # O endereço do broker vem do Config Server; as credenciais, de variáveis de ambiente.
  rabbitmq:
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

app:
  jwt:
    secret: ${JWT_SECRET}
  swagger:
    username: ${SWAGGER_USERNAME}
    password: ${SWAGGER_PASSWORD}
