services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: permissions_saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas123
    volumes:
      - permission_saas_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d permissions_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  audit-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit123
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    # O RabbitMQ guarda os dados por nome de nó, que vem do hostname: fixo, o volume
    # continua valendo quando o container é recriado.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: saas
      RABBITMQ_DEFAULT_PASS: saas123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  config-server:
    build:
      context: ./permission_saas_config
      dockerfile: Dockerfile
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  audit-service:
    build:
      context: ./permission_saas_audit
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      audit-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_USERNAME: audit
      DB_PASSWORD: audit123
      RABBITMQ_USERNAME: saas
      RABBITMQ_PASSWORD: saas123
    volumes:
      - audit_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  permission-service:
    build:
      context: ./permission_saas_api
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_USERNAME: saas
      DB_PASSWORD: saas123
      RABBITMQ_USERNAME: saas
      RABBITMQ_PASSWORD: saas123
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      SWAGGER_USERNAME: ${SWAGGER_USERNAME}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8080:8080"

  front:
    build:
      args:
        - VITE_DEV_CLIENT_ID=${VITE_DEV_CLIENT_ID}
      context: ./permission_saas_front
      dockerfile: Dockerfile
    depends_on:
      permission-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "3000:80"

volumes:
  permission_saas_pgdata:
  audit_pgdata:
  audit_logs:
  rabbitmq_data:
